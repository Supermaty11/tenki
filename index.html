<!doctype html>
<html lang="ja" data-theme="earth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天気</title>
  </head>
  <body>
    <main id="app">
      <header>
        <div class="topbar">
          <h1>天気</h1>
          <div class="theme-picker">
            <label for="theme">テーマ</label>
            <select id="theme" name="theme"></select>
          </div>
        </div>
        <form id="search">
          <label for="query">地点</label>
          <div class="search-field">
            <input id="query" name="query" type="search" placeholder="地点を検索" autocomplete="off" />
            <button id="clear" type="button" class="clear-btn" hidden aria-label="入力と結果をクリア">×</button>
            <ul id="suggestions" class="suggestions" hidden role="listbox" aria-label="地点候補"></ul>
          </div>
          <button type="submit">検索</button>
        </form>
      </header>
      <section id="favorites">
        <h2>お気に入り</h2>
        <p>地点を表示したあと、☆で登録できます。</p>
      </section>
      <section id="summary">
        <h2>統計天気</h2>
        <p>検索した地点の結果がここに出ます。</p>
      </section>
      <section id="hourly">
        <h2>時間別</h2>
        <p>その日の時間別です。</p>
      </section>
      <section id="weekly">
        <h2>週間</h2>
        <p>週間の統計です。</p>
      </section>
      <section id="links">
        <h2>各サイト</h2>
        <p>予報の取得はせず、サイトを開くボタンを置きます。</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
